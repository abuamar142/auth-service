name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  # Required for deploy.yml to call this as a reusable gate workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build, vet and unit-test. The integration suite in ./tests drives a running
# instance over HTTP (TestMain waits for /api/health and exits 1 when nothing
# answers), so it cannot run here — the deploy job exercises the real service
# through the VPS health check instead.
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./cmd/...

      - name: Build
        run: go build ./...
