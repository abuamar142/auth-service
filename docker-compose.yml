services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # ENV_FILE is set per environment (see docker-compose.dev/prod.yml).
    # Hardcoding ".env" makes the dev stack read the prod file, so anything
    # added to .env.dev — RESEND_API_KEY, for instance — is silently ignored.
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth-db}
    volumes:
      - auth-service-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth} -d ${POSTGRES_DB:-auth-db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-auth-db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      # This service is the token authority for every other service on the
      # host, so they have to be able to reach it by name. Without this entry
      # the container lands only on its own project network, and a caller on
      # abuamar-net gets a DNS failure — which surfaces as "invalid or expired
      # token" on every request, with the token itself perfectly valid. That
      # is what happened to backend-service.
      - default
      - abuamar-net

volumes:
  auth-service-pgdata:
    name: auth-service-pgdata

networks:
  abuamar-net:
    external: true
