basePath: /
definitions:
  github_com_abuamar142_auth-service_internal_models.CreateAPIKeyRequest:
    properties:
      expires_in:
        example: 90d
        type: string
      name:
        example: portfolio-backend
        type: string
    type: object
  github_com_abuamar142_auth-service_internal_models.LoginRequest:
    properties:
      identifier:
        example: test@example.com
        type: string
      password:
        example: secretpass123
        type: string
    type: object
  github_com_abuamar142_auth-service_internal_models.LogoutRequest:
    properties:
      refresh_token:
        example: e1d2a3b4c5f6a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1f2
        type: string
    type: object
  github_com_abuamar142_auth-service_internal_models.RefreshRequest:
    properties:
      refresh_token:
        example: e1d2a3b4c5f6a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1f2
        type: string
    type: object
  github_com_abuamar142_auth-service_internal_models.RegisterRequest:
    properties:
      display_name:
        example: John Doe
        type: string
      email:
        example: test@example.com
        type: string
      password:
        example: secretpass123
        type: string
      username:
        example: johndoe
        type: string
    type: object
  github_com_abuamar142_auth-service_internal_models.SwaggerAPIKeyResponse:
    properties:
      data:
        properties:
          api_key:
            properties:
              created_at:
                example: "2026-09-16T08:30:00Z"
                type: string
              expires_at:
                example: "2026-12-15T00:00:00Z"
                type: string
              id:
                example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                type: string
              name:
                example: portfolio-backend
                type: string
              prefix:
                example: ak_a1b2c3d4
                type: string
            type: object
          key:
            example: ak_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
            type: string
        type: object
      message:
        example: api key created
        type: string
      success:
        example: true
        type: boolean
    type: object
  github_com_abuamar142_auth-service_internal_models.SwaggerError:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      details:
        example: field is required
        type: string
    type: object
  github_com_abuamar142_auth-service_internal_models.SwaggerResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_abuamar142_auth-service_internal_models.SwaggerError'
      message:
        example: operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  github_com_abuamar142_auth-service_internal_models.SwaggerTokenResponse:
    properties:
      data:
        properties:
          access_token:
            example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIyZDk0NGVkNi0yODVlLTRjMTMtODkxMS04OTUyMGMzNGU0M2QiLCJlbWFpbCI6InRlc3RAZXhhbXBsZS5jb20iLCJ1c2VybmFtZSI6ImpvaG5kb2UiLCJpYXQiOjE3ODk1NDcwNTksImV4cCI6MTc4OTU0Nzk1OX0.RWWXCR49EGPyZvVeqDTmKAdn3pnpXXWK1yx9Jk5-BRY
            type: string
          refresh_token:
            example: 54204a5db8e34b88874032e4b63add0e538747c0e498f4db7217b706dda18c24
            type: string
        type: object
      message:
        example: login successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  github_com_abuamar142_auth-service_internal_models.SwaggerUser:
    properties:
      created_at:
        example: "2026-09-16T08:23:55.441437Z"
        type: string
      display_name:
        example: John Doe
        type: string
      email:
        example: test@example.com
        type: string
      id:
        example: 2d944ed6-285e-4c13-8911-89520c34e43d
        type: string
      updated_at:
        example: "2026-09-16T08:23:55.441437Z"
        type: string
      username:
        example: johndoe
